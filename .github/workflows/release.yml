# Builds mujoco-warp-pbr and newton-pbr and publishes them to PyPI when a v* tag is pushed, or by
# hand for an existing tag (workflow_dispatch, e.g. to finish a partly failed release).
# Uses PyPI trusted publishing: no token is stored; each project trusts this workflow and the
# GitHub environment named in the matrix (https://docs.pypi.org/trusted-publishers/): `pypi` for
# mujoco-warp-pbr, `pypi-newton-pbr` for newton-pbr. Separate environments let PyPI tell the two
# projects apart, since both trust the same repository and workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (files already on PyPI are skipped)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches both package versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          for f in pyproject.toml newton-pbr/pyproject.toml; do
            grep -q "^version = \"$tag\"$" "$f" || { echo "$f does not have version $tag"; exit 1; }
          done
      - run: uv build --package mujoco-warp-pbr --out-dir dist/mujoco-warp-pbr
      - run: uv build --package newton-pbr --out-dir dist/newton-pbr
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - package: mujoco-warp-pbr
            environment: pypi
          - package: newton-pbr
            environment: pypi-newton-pbr
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true
