[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-warp-pbr"
version = "0.0.1"
description = "Batched physically based renderer for MuJoCo Warp"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
authors = [{name = "Julien Blanchon"}]
keywords = ["mujoco", "mujoco-warp", "warp", "rendering", "pbr", "ray-tracing", "robotics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.13.0",
    # The renderer builds on mujoco_warp._src internals: pinned to a revision in [tool.uv.sources].
    "mujoco-warp>=3.16.0",
    "numpy",
    "warp-lang>=1.15",
]

[project.urls]
Repository = "https://github.com/julien-blanchon/mujoco_warp_pbr"
Issues = "https://github.com/julien-blanchon/mujoco_warp_pbr/issues"

[project.optional-dependencies]
# Type-checking-only stubs (shape-aware Warp and NumPy, MuJoCo): `pip install mujoco-warp-pbr[typing]`.
typing = [
    "mujoco-stubs>=3.13",
    "pyrefly-numpy-stubs>=1.4",
    "pyrefly-warp-stubs>=0.1",
]
dev = [
    "mujoco-warp-pbr[typing]",
    "pillow",
    "pre-commit",
    "pyrefly>=1.4",
    "pytest",
    "pytest-xdist",
    "ruff",
]
# Reference renderers and image metrics used by benchmarks/.
bench = [
    "flip-evaluator",
    "mitsuba",
    "pillow",
    "newton",
    "pygltflib>=1.16.5",
    "trimesh",
    "usd-core",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.workspace]
members = ["newton-pbr"]

[tool.uv.sources]
warp-lang = {index = "nvidia"}
mujoco = {index = "mujoco"}
# Pinned: the renderer builds on mujoco_warp._src internals.
mujoco-warp = {git = "https://github.com/google-deepmind/mujoco_warp", rev = "6c33934b3cc0a81025b212e574fa95fca16ef4c5"}

[tool.ruff]
line-length = 128
indent-width = 2
extend-exclude = ["context", "*.ipynb"]

[tool.ruff.lint]
select = ["D", "I", "W", "E", "F", "B", "UP", "RUF", "BLE", "C4", "PLW1510"]
# UP018 (native literals) and RUF046 (int of int) would rewrite Warp kernel code, where
# float(x) / int(x) casts are typed DSL calls.
ignore = ["D100", "D103", "E741", "UP018", "RUF001", "RUF002", "RUF003", "RUF046"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["mujoco_warp_pbr", "newton_pbr"]
single-line-exclusions = ["typing"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 128

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"tests/*" = ["D"]
"benchmarks/*" = ["D"]
"tools/*" = ["D"]
# TODO: remove after the library pass (rules added with the benchmark / tooling pass).
"mujoco_warp_pbr/**" = ["B905", "BLE001", "C401", "F841", "RUF005", "RUF059", "UP006", "UP035", "UP045"]


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "newton-pbr/tests"]
# The benchmark scripts and tools import their siblings as top-level modules.
pythonpath = ["benchmarks", "tools"]
markers = ["slow: heavy path-traced references (deselect with -m 'not slow')"]

[tool.setuptools.packages.find]
include = ["mujoco_warp_pbr*"]

# Type checking: Pyrefly with the `typing` extra (shape-aware Warp / NumPy stubs, MuJoCo stubs).
# Benchmarks and tools import their sibling modules as scripts. The `default` preset is needed: `basic`
# (Pyrefly without a config) hides shape errors.
[tool.pyrefly]
preset = "default"
search-path = [".", "benchmarks", "tools", "tools/hf", "newton-pbr"]
project-excludes = ["context", "**/.venv"]
# Optional packages without types: USD (compiled), OptiX / ovrtx bindings (not on PyPI), and
# huggingface_hub (declared only in the inline metadata of the tools/hf scripts).
ignore-missing-imports = ["pxr.*", "optix", "ovrtx", "huggingface_hub"]

# Warp kernels in the library are not shape-typed yet, and Warp's DSL (array indexing, vector
# arithmetic, struct fields) reads as errors without ranked annotations: off until the library port.
[[tool.pyrefly.sub-config]]
matches = "mujoco_warp_pbr/**"

[tool.pyrefly.sub-config.errors]
bad-index = "ignore"
unsupported-operation = "ignore"
not-iterable = "ignore"
bad-unpacking = "ignore"

# Same as above, until the library port.
[[tool.pyrefly.sub-config]]
matches = "newton-pbr/**"

[tool.pyrefly.sub-config.errors]
bad-index = "ignore"
unsupported-operation = "ignore"
not-iterable = "ignore"
bad-unpacking = "ignore"

[tool.setuptools.package-data]
"*" = ["py.typed"]
