[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-warp-pbr"
version = "0.0.1"
description = "Batched physically based renderer for MuJoCo Warp"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
authors = [{name = "Julien Blanchon"}]
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.13.0",
    "mujoco-warp",
    "numpy",
    "warp-lang>=1.15",
]

[project.optional-dependencies]
dev = [
    "pillow",
    "pre-commit",
    "pytest",
    "pytest-xdist",
    "ruff",
]
# Reference renderers and image metrics used by benchmarks/.
bench = [
    "flip-evaluator",
    "mitsuba",
    "pillow",
    "newton",
    "pygltflib>=1.16.5",
    "trimesh",
    "usd-core",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.workspace]
members = ["newton-pbr"]

[tool.uv.sources]
warp-lang = {index = "nvidia"}
mujoco = {index = "mujoco"}
# Pinned: the renderer builds on mujoco_warp._src internals.
mujoco-warp = {git = "https://github.com/google-deepmind/mujoco_warp", rev = "6c33934b3cc0a81025b212e574fa95fca16ef4c5"}

[tool.ruff]
line-length = 128
indent-width = 2
extend-exclude = ["context", "*.ipynb", "research/optix_poc"]

[tool.ruff.lint]
select = ["D", "I", "W", "F401"]
ignore = ["D100", "D103"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["mujoco_warp_pbr", "newton_pbr"]
single-line-exclusions = ["typing"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 128

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"tests/*" = ["D"]
"benchmarks/*" = ["D"]
"tools/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "newton-pbr/tests"]

[tool.setuptools.packages.find]
include = ["mujoco_warp_pbr*"]

# Type checking (ty, pyrefly). Benchmarks and tools import their sibling modules as scripts.
# Warp kernels (@wp.kernel / @wp.func / @wp.struct) are a DSL that type checkers misread: array
# indexing, vector arithmetic and struct annotations, so those rules are off. MuJoCo ships no stubs
# for its extension modules.
[tool.ty.environment]
extra-paths = ["benchmarks", "tools", "newton-pbr"]

[tool.ty.analysis]
replace-imports-with-any = ["mujoco", "mujoco.**"]
allowed-unresolved-imports = ["pxr.**", "newton.**", "newton", "optix", "ovrtx", "huggingface_hub", "mitsuba", "pygltflib", "trimesh", "flip_evaluator"]

[tool.ty.src]
exclude = ["research/optix_poc", "context"]

[tool.ty.rules]
invalid-type-form = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
unsupported-operator = "ignore"

[tool.pyrefly]
search-path = [".", "benchmarks", "tools", "newton-pbr"]
project-excludes = ["research/optix_poc", "context", "**/.venv"]
replace-imports-with-any = ["mujoco", "mujoco.*"]
ignore-missing-imports = ["pxr.*", "newton", "newton.*", "optix", "ovrtx", "huggingface_hub", "mitsuba", "pygltflib", "trimesh", "flip_evaluator"]

[tool.pyrefly.errors]
bad-index = "ignore"
unsupported-operation = "ignore"
not-iterable = "ignore"
bad-unpacking = "ignore"
