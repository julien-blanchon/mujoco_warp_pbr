[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-pbr"
version = "0.0.1"
description = "Physically based camera sensor for Newton, rendered by mujoco_warp_pbr"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mujoco-warp-pbr",
    "newton>=1.7",
]

[tool.setuptools.packages.find]
include = ["newton_pbr*"]

[tool.uv.sources]
mujoco-warp-pbr = {workspace = true}
